<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BUY HARD mobile app recording</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 2340px;
        overflow: hidden;
        background: #dce985;
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 2340px;
        overflow: hidden;
      }
      iframe {
        display: block;
        border: 0;
        width: 360px;
        height: 780px;
        transform: scale(3);
        transform-origin: top left;
      }
    </style>
  </head>
  <body>
    <main
      id="stage"
      data-composition-id="mobile-app"
      data-start="0"
      data-duration="90"
      data-width="1080"
      data-height="2340"
      data-fps="24"
    >
      <iframe id="mobile" title="BUY HARD mobile interface" src="./app.html"></iframe>
    </main>
    <script type="module" src="/stage.ts"></script>
  </body>
</html>
